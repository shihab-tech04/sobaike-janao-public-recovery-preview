name: Public recovery preview

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-recovery-preview
  cancel-in-progress: true

jobs:
  source-check:
    name: Check latest Public recovery source
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Pin the independently verified recovery checkpoint
        id: verify
        shell: bash
        env:
          SOURCE_REPOSITORY: shihab-tech04/Sobaike-janao-public
          SOURCE_BRANCH: recovery/2026-10-15-public-write-gateway
          VERIFIED_SOURCE_SHA: bd228c038f634b13c4f2e10cdfb9302ffc342069
          REQUIRED_BROWSER_CHECK: Public responsive EN/BN browser smoke
          VERIFIED_BUILD_RUN: https://github.com/shihab-tech04/Sobaike-janao-public/actions/runs/39299869863
          VERIFIED_BROWSER_RUN: https://github.com/shihab-tech04/Sobaike-janao-public/actions/runs/39299863610
          VERIFIED_SQL_RUN: https://github.com/shihab-tech04/Sobaike-janao-public/actions/runs/39299863688
        run: |
          set -euo pipefail
          actual_sha="$(git ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "refs/heads/${SOURCE_BRANCH}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$actual_sha" ]; then
            echo "Could not resolve the recovery branch." >&2
            exit 1
          fi
          if [ "$actual_sha" != "$VERIFIED_SOURCE_SHA" ]; then
            echo "The recovery branch no longer matches its independently verified checkpoint." >&2
            echo "Branch: $actual_sha" >&2
            echo "Verified: $VERIFIED_SOURCE_SHA" >&2
            exit 1
          fi
          echo "Verified recovery source SHA: $actual_sha"
          echo "Required source checks: build and $REQUIRED_BROWSER_CHECK"
          echo "Build evidence: $VERIFIED_BUILD_RUN"
          echo "Verified source browser run: $VERIFIED_BROWSER_RUN"
          {
            echo "ready=true"
            echo "source_sha=$actual_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Source repository: \`$SOURCE_REPOSITORY\`"
            echo "Source branch: \`$SOURCE_BRANCH\`"
            echo "Verified source commit: \`$actual_sha\`"
            echo "Source build independently verified; previous identical UI has browser baseline and this deployment runs $REQUIRED_BROWSER_CHECK again."
            echo "- Build run: $VERIFIED_BUILD_RUN"
            echo "- Responsive browser run: $VERIFIED_BROWSER_RUN"
            echo "- Isolated SQL verification run: $VERIFIED_SQL_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    name: Build, deploy, and browser-verify Public preview
    needs: source-check
    if: needs.source-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://ahiaymyqfmyyrjkwgvhi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3wqaYyxPJ6spRNS0jNOi4w_69Jqc3-b
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the verified Public recovery source
        shell: bash
        env:
          SOURCE_REPOSITORY: shihab-tech04/Sobaike-janao-public
          SOURCE_BRANCH: recovery/2026-10-15-public-write-gateway
          EXPECTED_SOURCE_SHA: ${{ needs.source-check.outputs.source_sha }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/${SOURCE_REPOSITORY}.git" app-source
          actual_sha="$(git -C app-source rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "The source branch changed after its checks were read; wait for the next scheduled run." >&2
            exit 1
          fi
          echo "Verified source SHA: $actual_sha"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-source/package-lock.json

      - name: Install Public dependencies
        working-directory: app-source
        run: npm ci

      - name: Build with production Supabase publishable client
        working-directory: app-source
        env:
          VITE_BASE_PATH: /sobaike-janao-public-recovery-preview/
        run: npm run build

      - name: Add source evidence and static Pages fallback
        working-directory: app-source
        env:
          SOURCE_SHA: ${{ needs.source-check.outputs.source_sha }}
          SOURCE_REPOSITORY: shihab-tech04/Sobaike-janao-public
          SOURCE_BRANCH: recovery/2026-10-15-public-write-gateway
        run: |
          set -euo pipefail
          if ! grep -R -F -q "$VITE_SUPABASE_URL" dist/assets; then
            echo "The approved production Supabase endpoint is missing from the bundle." >&2
            exit 1
          fi
          if ! grep -R -F -q "$VITE_SUPABASE_PUBLISHABLE_KEY" dist/assets; then
            echo "The approved public browser key is missing from the bundle." >&2
            exit 1
          fi
          if grep -R -E -q 'sb_secret_[A-Za-z0-9_-]+' dist/assets; then
            echo "A non-public Supabase secret is present in the browser bundle." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path("dist")
          checkpoint = {
              "application": "Public",
              "sourceRepository": os.environ["SOURCE_REPOSITORY"],
              "sourceBranch": os.environ["SOURCE_BRANCH"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "sourceChecks": ["build", "Public responsive EN/BN browser smoke"],
              "backend": "production Supabase via browser publishable client, RLS, and JWT authorization",
              "deployedAt": datetime.now(timezone.utc).isoformat(),
          }
          (dist / "recovery-checkpoint.json").write_text(json.dumps(checkpoint, indent=2) + "\n", encoding="utf-8")
          index = dist / "index.html"
          html = index.read_text(encoding="utf-8")
          marker = f'<meta name="sobaike-recovery-source-sha" content="{os.environ["SOURCE_SHA"]}">'
          if "</head>" not in html:
              raise SystemExit("Built index has no head section.")
          index.write_text(html.replace("</head>", f"  {marker}\n</head>", 1), encoding="utf-8")
          (dist / "404.html").write_bytes(index.read_bytes())
          PY
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/recovery-checkpoint.json

      - name: Attach unlinked and noindex synthetic News Intake QA pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-source/dist/qa-news/articles
          cp fixtures/news-intake/index.html app-source/dist/qa-news/index.html
          cp fixtures/news-intake/articles/20261019-dhaka-road-collision.html app-source/dist/qa-news/articles/
          grep -q 'noindex,nofollow' app-source/dist/qa-news/index.html
          grep -q 'TEST FIXTURE' app-source/dist/qa-news/articles/20261019-dhaka-road-collision.html

      - name: Verify live Supabase read RPC and Public write-gateway CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null --connect-timeout 10 --max-time 60 \
            --request POST --header "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' --data '{}' \
            "$VITE_SUPABASE_URL/rest/v1/rpc/get_public_published_reports"
          cors_headers="$(curl --fail --silent --show-error --include --request OPTIONS \
            --header 'Origin: https://shihab-tech04.github.io' \
            --header 'Access-Control-Request-Method: POST' \
            "$VITE_SUPABASE_URL/functions/v1/public-write-gateway")"
          if ! printf '%s' "$cors_headers" | tr -d '\r' | grep -Fiq 'access-control-allow-origin: https://shihab-tech04.github.io'; then
            echo 'Public write-gateway does not permit the GitHub Pages origin.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the built Public preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: app-source/dist

      - name: Deploy the Public preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed HTML, assets, and source SHA
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ needs.source-check.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          export SITE_URL SOURCE_SHA
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urljoin
          from urllib.request import urlopen

          site = os.environ["SITE_URL"]
          expected = os.environ["SOURCE_SHA"]
          with urlopen(site, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"Preview index returned HTTP {response.status}")
              html = response.read().decode("utf-8")
          if expected not in html:
              raise SystemExit("Live index does not identify the expected recovery SHA")

          with urlopen(urljoin(site, "recovery-checkpoint.json"), timeout=30) as response:
              checkpoint = json.load(response)
          if checkpoint.get("sourceCommit") != expected or checkpoint.get("application") != "Public":
              raise SystemExit("Live checkpoint metadata does not match the expected Public source SHA")

          assets = re.findall(r'(?:src|href)="([^"]+\.(?:js|css)(?:\?[^"]*)?)"', html)
          if not assets:
              raise SystemExit("Live index contains no built JavaScript or CSS assets")
          for asset in assets:
              with urlopen(urljoin(site, asset), timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"Live asset returned HTTP {response.status}: {asset}")
          hero_images = [
              "illustrations/services/harassment-hero-public-harassment-v02.jpg",
              "illustrations/services/rickshaw-hero-illegal-charging-station-v02.jpg",
              "illustrations/services/extortion-hero-shopkeeper-coercion-v02.jpg",
              "illustrations/services/load-shedding-hero-family-blackout-v01.jpg",
              "illustrations/services/public-safety-hero-rickshaw-snatching-reconstructed-v01.jpg",
              "illustrations/services/road-transport-hero-broken-road-rickshaw-reconstructed-v01.jpg",
              "illustrations/services/illegal-occupation-hero-footpath-encroachment-reconstructed-v01.jpg",
          ]
          for asset in hero_images:
              with urlopen(urljoin(site, asset), timeout=30) as response:
                  if response.status != 200 or not response.headers.get("Content-Type", "").startswith("image/jpeg"):
                      raise SystemExit(f"Live hero image unavailable or wrong type: {asset}")
          print(f"HTTP 200: {site}")
          print(f"Verified {len(assets)} live JS/CSS assets, {len(hero_images)} hero images, and source SHA {expected}")
          PY

      - name: Install browser smoke runner
        working-directory: app-source
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Browser-verify the live Public preview in English and Bengali
        working-directory: app-source
        env:
          RECOVERY_BROWSER_APP: public
          RECOVERY_BROWSER_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          RECOVERY_EXPECT_SUPABASE_HOST: ahiaymyqfmyyrjkwgvhi.supabase.co
        run: node tests/recovery-browser-smoke.mjs

      - name: Record deployed checkpoint evidence
        if: success()
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ needs.source-check.outputs.source_sha }}
        run: |
          {
            echo "## Public Recovery Preview: DEPLOYED and browser-verified"
            echo "- URL: $SITE_URL"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Backend integration: production Supabase publishable client (restricted by RLS and JWT)."
          } >> "$GITHUB_STEP_SUMMARY"
